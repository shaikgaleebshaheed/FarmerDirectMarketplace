<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Farmer Direct Marketplace</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {

            min-height: 100vh;

            background-image:
                    linear-gradient(
                            rgba(255,255,255,0.15),
                            rgba(255,255,255,0.15)
                    ),
                    url("farmer-background.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {

            width: 420px;

            padding: 45px 40px;

            background: rgba(255,255,255,0.90);

            border-radius: 22px;

            box-shadow:
                    0 15px 40px rgba(0,0,0,0.20);

            text-align: center;

            backdrop-filter: blur(3px);
        }

        .icon {

            font-size: 60px;

            margin-bottom: 10px;
        }

        h1 {

            color: #2e7d32;

            font-size: 34px;

            margin-bottom: 10px;
        }

        .description {

            color: #666;

            margin-bottom: 30px;
        }

        .error {

            color: red;

            font-weight: bold;

            margin-bottom: 20px;
        }

        .form-group {

            text-align: left;

            margin-bottom: 20px;
        }

        label {

            display: block;

            color: #2e7d32;

            font-weight: bold;

            margin-bottom: 8px;
        }

        input {

            width: 100%;

            padding: 13px;

            border: 1px solid #bbb;

            border-radius: 9px;

            font-size: 15px;

            background: #eef4ff;
        }

        input:focus {

            outline: none;

            border-color: #43a047;
        }

        .login-btn {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 9px;

            background: #43a047;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;
        }

        .login-btn:hover {

            background: #2e7d32;
        }

        .register {

            margin-top: 22px;

            color: #555;
        }

        .register a {

            color: #2e7d32;

            font-weight: bold;

            text-decoration: none;
        }

        .register a:hover {

            text-decoration: underline;
        }

        .back {

            display: block;

            margin-top: 22px;

            color: #2e7d32;

            text-decoration: none;

            font-weight: bold;
        }

        .back:hover {

            text-decoration: underline;
        }

    </style>

</head>

<body>

<div class="card">

    <div class="icon">
        🔐
    </div>

    <h1>
        Login
    </h1>

    <p class="description" id="description">
        Login to Farmer Direct Marketplace
    </p>

    <div id="errorMessage" class="error"></div>

    <form action="login" method="post">

        <!-- Role will be automatically filled -->
        <input type="hidden"
               id="role"
               name="role">

        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                    type="email"
                    id="email"
                    name="email"
                    required>

        </div>

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                    type="password"
                    id="password"
                    name="password"
                    required>

        </div>

        <button type="submit"
                class="login-btn">

            🔐 Login

        </button>

    </form>

    <div class="register">

        Don't have an account?

        <a id="registerLink"
           href="register.html">

            Register

        </a>

    </div>

    <a href="index.html"
       class="back">

        ← Back to Role Selection

    </a>

</div>

<script>

    const params = new URLSearchParams(
        window.location.search
    );

    const role = params.get("role");

    const error = params.get("error");

    const roleInput =
        document.getElementById("role");

    const description =
        document.getElementById("description");

    const registerLink =
        document.getElementById("registerLink");

    const errorMessage =
        document.getElementById("errorMessage");


    /*
       Set role
    */

    if (role === "farmer") {

        roleInput.value = "farmer";

        description.textContent =
            "Login as Farmer";

        registerLink.href =
            "register.html?role=farmer";

    }
    else if (role === "customer") {

        roleInput.value = "customer";

        description.textContent =
            "Login as Customer";

        registerLink.href =
            "register.html?role=customer";

    }
    else {

        roleInput.value = "";

        description.textContent =
            "Please select a role first.";

    }


    /*
       Show error
    */

    if (error === "1") {

        errorMessage.textContent =
            "Invalid email or password.";

    }
    else if (error === "role") {

        errorMessage.textContent =
            "Please select a valid role.";

    }

</script>

</body>

</html>
