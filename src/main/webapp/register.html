<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - Farmer Direct Marketplace</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {

            min-height: 100vh;

            background-image:
                    linear-gradient(
                            rgba(255,255,255,0.20),
                            rgba(255,255,255,0.20)
                    ),
                    url("farmer-background.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            display: flex;
            justify-content: center;
            align-items: center;

        }

        .card {

            width: 420px;

            padding: 40px;

            background: rgba(255,255,255,0.90);

            border-radius: 22px;

            box-shadow:
                    0 15px 40px rgba(0,0,0,0.20);

            text-align: center;

            backdrop-filter: blur(3px);

        }

        .icon {

            font-size: 60px;

            margin-bottom: 10px;

        }

        h1 {

            color: #2e7d32;

            font-size: 34px;

            margin-bottom: 10px;

        }

        .subtitle {

            color: #666;

            margin-bottom: 25px;

        }

        .message {

            color: red;

            font-weight: bold;

            margin-bottom: 15px;

            display: none;

        }

        .form-group {

            text-align: left;

            margin-bottom: 16px;

        }

        label {

            display: block;

            color: #2e7d32;

            font-weight: bold;

            margin-bottom: 7px;

        }

        input,
        select {

            width: 100%;

            padding: 12px;

            border: 1px solid #bbb;

            border-radius: 9px;

            font-size: 15px;

            background: #eaf2ff;

            outline: none;

        }

        input:focus,
        select:focus {

            border-color: #43a047;

        }

        .register-btn {

            width: 100%;

            padding: 14px;

            margin-top: 5px;

            background: #43a047;

            color: white;

            border: 2px solid #43a047;

            border-radius: 9px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }

        .register-btn:hover {

            background: #2e7d32;

        }

        .login {

            margin-top: 20px;

            color: #666;

        }

        .login a {

            color: #2e7d32;

            font-weight: bold;

            text-decoration: none;

        }

        .login a:hover {

            text-decoration: underline;

        }

        .back {

            display: block;

            margin-top: 20px;

            color: #2e7d32;

            text-decoration: none;

            font-weight: bold;

        }

        .back:hover {

            text-decoration: underline;

        }

    </style>

</head>

<body>

<div class="card">

    <div class="icon">
        📝
    </div>

    <h1>
        Register
    </h1>

    <p class="subtitle" id="subtitle">
        Please select a role first.
    </p>

    <div class="message" id="message"></div>

    <form action="register"
          method="post"
          id="registerForm">

        <input type="hidden"
               name="role"
               id="role">

        <div class="form-group">

            <label>
                Name
            </label>

            <input type="text"
                   name="name"
                   required>

        </div>

        <div class="form-group">

            <label>
                Email
            </label>

            <input type="email"
                   name="email"
                   required>

        </div>

        <div class="form-group">

            <label>
                Password
            </label>

            <input type="password"
                   name="password"
                   required>

        </div>

        <button type="submit"
                class="register-btn">

            📝 Register

        </button>

    </form>

    <div class="login">

        Already have an account?

        <a id="loginLink"
           href="login.html">

            Login

        </a>

    </div>

    <a href="home.html"
       class="back">

        ← Back to Role Selection

    </a>

</div>

<script>

    const params = new URLSearchParams(window.location.search);

    const role = params.get("role");
    const error = params.get("error");

    const roleInput = document.getElementById("role");
    const subtitle = document.getElementById("subtitle");
    const message = document.getElementById("message");
    const loginLink = document.getElementById("loginLink");
    const registerForm = document.getElementById("registerForm");

    if (role === "farmer") {

        roleInput.value = "farmer";

        subtitle.innerHTML =
            'Register as <strong>Farmer</strong>';

        loginLink.href =
            "login.html?role=farmer";

    }
    else if (role === "customer") {

        roleInput.value = "customer";

        subtitle.innerHTML =
            'Register as <strong>Customer</strong>';

        loginLink.href =
            "login.html?role=customer";

    }
    else {

        roleInput.value = "";

        subtitle.innerHTML =
            "Please select a role first.";

        message.style.display = "block";

        message.innerHTML =
            "Please select a valid role.";

        registerForm.addEventListener("submit", function(event) {

            event.preventDefault();

            alert("Please select Farmer or Customer first.");

        });

    }

    if (error === "1") {

        message.style.display = "block";

        message.innerHTML =
            "Registration failed. Email may already exist.";

    }

</script>

</body>

</html>
