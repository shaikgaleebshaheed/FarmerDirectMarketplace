<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Customer - Farmer Direct Marketplace</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {

            min-height: 100vh;

            background-image:
                    linear-gradient(
                            rgba(255,255,255,0.15),
                            rgba(255,255,255,0.15)
                    ),
                    url("farmer-background.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {

            width: 420px;

            padding: 55px 45px;

            background: rgba(255,255,255,0.90);

            border-radius: 22px;

            box-shadow:
                    0 15px 40px rgba(0,0,0,0.20);

            text-align: center;

            backdrop-filter: blur(3px);
        }

        .icon {

            font-size: 65px;

            margin-bottom: 15px;
        }

        h1 {

            color: #2e7d32;

            font-size: 34px;

            margin-bottom: 18px;
        }

        .description {

            color: #555;

            font-size: 16px;

            line-height: 1.6;

            margin-bottom: 35px;
        }

        .btn {

            display: block;

            width: 100%;

            padding: 16px;

            margin-bottom: 15px;

            border-radius: 10px;

            text-decoration: none;

            font-size: 16px;

            font-weight: bold;

            text-align: center;

            transition: 0.3s;
        }

        .login-btn {

            background: #43a047;

            color: white;

            border: 2px solid #43a047;
        }

        .login-btn:hover {

            background: #2e7d32;

            border-color: #2e7d32;
        }

        .register-btn {

            background: white;

            color: #2e7d32;

            border: 2px solid #43a047;
        }

        .register-btn:hover {

            background: #e8f5e9;
        }

        .back {

            display: block;

            margin-top: 20px;

            color: #2e7d32;

            text-decoration: none;

            font-weight: bold;
        }

        .back:hover {

            text-decoration: underline;
        }

    </style>

</head>

<body>

<div class="card">

    <div class="icon">
        🛒
    </div>

    <h1>
        Customer
    </h1>

    <p class="description">
        Discover fresh products from farmers and place your orders directly.
    </p>

    <a href="login.html?role=customer"
       class="btn login-btn">

        🔐 Login as Customer

    </a>

    <a href="register.html?role=customer"
       class="btn register-btn">

        📝 Register as Customer

    </a>

    <a href="index.html"
       class="back">

        ← Back to Role Selection

    </a>

</div>

</body>

</html>
